theme: dark

identity_validation:
  reset_password:
    jwt_secret: ${AUTHELIA_JWT_SECRET}

log:
  level: info

server:
  port: 9091

storage:
  encryption_key: ${AUTHELIA_ENCRYPTION_KEY}
  local:
    path: /config/db.sqlite3

authentication_backend:
  password_reset:
    disable: true
  refresh_interval: 1m
  file:
    path: /config/users_database.yml
    password:
      algorithm: pbkdf2
      pbkdf2:
        variant: sha256
        iterations: 100000
        salt_length: 16

access_control:
  default_policy: one_factor

session:
  name: authelia_session
  secret: ${AUTHELIA_SESSION_SECRET}
  expiration: 1h
  inactivity: 5m
  cookies:
    - domain: "dushyant.com"
      authelia_url: "https://lore.dushyant.com"

regulation:
  max_retries: 3
  find_time: 2m
  ban_time: 5m

notifier:
  disable_startup_check: true
  filesystem:
    filename: /config/notification.txt
