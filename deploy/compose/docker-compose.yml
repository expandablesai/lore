name: lore

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: lore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lore}
      POSTGRES_DB: lore
    volumes:
      - /srv/lore/pgdata:/var/lib/postgresql/data
    command: >
      postgres -c shared_buffers=512MB -c effective_cache_size=2GB
               -c maintenance_work_mem=128MB -c work_mem=16MB
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lore"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    image: ghcr.io/expandyne/lore:latest
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://lore:${POSTGRES_PASSWORD:-lore}@db:5432/lore
      NODE_OPTIONS: "--max-old-space-size=1024"
      HOST: 0.0.0.0
      LORE_ENCRYPTION_KEY: ${LORE_ENCRYPTION_KEY}
    ports:
      - "3001:3001"
    volumes:
      - /srv/lore/blobs:/srv/lore/blobs
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1536M

  worker:
    image: ghcr.io/expandyne/lore:latest
    command: ["node", "apps/worker/dist/index.js"]
    restart: unless-stopped
    volumes:
      - /srv/lore/blobs:/srv/lore/blobs
    environment:
      DATABASE_URL: postgresql://lore:${POSTGRES_PASSWORD:-lore}@db:5432/lore
      NODE_OPTIONS: "--max-old-space-size=512"
      LORE_ENCRYPTION_KEY: ${LORE_ENCRYPTION_KEY}
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768M

  web:
    image: ghcr.io/expandyne/lore:latest
    # Replace the published bundle rather than layering it over the previous
    # build, so old hashed assets stop accumulating in the volume.
    entrypoint: ["sh", "-c", "rm -rf /web_dist/* && cp -a apps/web/dist/. /web_dist/"]
    volumes:
      - web_dist:/web_dist
    restart: "no"

  authelia:
    image: authelia/authelia:4
    volumes:
      - ../authelia/configuration.yml:/config/configuration.yml:ro
      - /srv/lore/authelia/users_database.yml:/config/users_database.yml:ro
      - /srv/lore/authelia:/state
    environment:
      LORE_AUTH_JWT_SECRET: ${LORE_AUTH_JWT_SECRET}
      LORE_AUTH_ENCRYPTION_KEY: ${LORE_AUTH_ENCRYPTION_KEY}
      LORE_AUTH_SESSION_SECRET: ${LORE_AUTH_SESSION_SECRET}
    ports:
      - "9091:9091"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9091/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # A single-file bind mount follows the inode: replacing the file on the
      # host (git checkout, editor save-and-rename) leaves the container reading
      # the old copy. Mount the directory instead so edits are always visible.
      - ./:/caddy-config:ro
      - web_dist:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    command: ["caddy", "run", "--config", "/caddy-config/Caddyfile", "--adapter", "caddyfile"]
    depends_on:
      web:
        condition: service_completed_successfully
      app:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  caddy_data:
  caddy_config:
  web_dist:
